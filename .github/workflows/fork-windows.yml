# Personal fork build: DeckCraft with the Traditional Chinese interface, for Windows.
# Builds the zh-hant branch and publishes a portable zip to this fork's Releases.
name: Fork build (Windows, zh-hant)

on:
  workflow_dispatch:
  push:
    branches: [zh-hant]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: deckcraft
      - uses: actions/checkout@v4
        with:
          repository: nowind202308/craft-i18n
          ref: fork-build
          path: craft-i18n
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deckcraft
      - name: Build
        working-directory: deckcraft
        shell: bash
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release -p deckcraft
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path deckcraft/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "DeckCraft-$v-zh-hant-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item deckcraft/target/release/deckcraft.exe $name/
          Copy-Item deckcraft/LICENSE* $name/ -ErrorAction SilentlyContinue
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=zh-hant-v$v-$(Get-Date -Format yyyyMMdd-HHmm)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: deckcraft
        run: |
          gh release create "$TAG" "../$ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeckCraft 繁體中文 ($TAG)" \
            --notes "個人 fork 版：繁體中文（台灣用語）介面；Preferences 可開關啟動時的官方更新檢查（預設關閉）。解壓後執行 deckcraft.exe。"
